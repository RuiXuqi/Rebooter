// You may write any gradle buildscript component in this file
// This file is automatically applied after build.gradle + dependencies.gradle is ran

// If you wish to use the default helper methods, uncomment the line below
// apply from: 'gradle/scripts/helpers.gradle'

apply plugin: 'com.diffplug.spotless'

spotless {
    enforceCheck false

    java {
        target fileTree('src') {
            include "*/java/**/*.java"
        }

        leadingTabsToSpaces()
        endWithNewline()
        removeUnusedImports()
    }
}

mcpForge.addModdingDependenciesTo(sourceSets.test)

tasks.withType(Test).configureEach {
    maxParallelForks = 1
}

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def testmodJar = tasks.register('testmodJar', Jar) {
    group = 'verification'
    description = 'Builds the Rebooter test mod coremod jar for development runs.'
    archiveBaseName = 'rebooter-testmod'
    archiveVersion = ''
    // Kept out of build/libs, which is what the release workflow uploads
    destinationDirectory = layout.buildDirectory.dir('testlibs')
    from sourceSets.testmod.output
    manifest {
        attributes(
                'FMLCorePlugin': 'testmod.TestModPlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
}

['runClient', 'runServer'].each { taskName ->
    tasks.named(taskName).configure {
        dependsOn testmodJar
        doFirst {
            copy {
                from testmodJar
                into file('run/mods')
            }
            copy {
                from file('src/testmod/config/rebooter')
                from file('src/testmod/config/fixtures')
                into file('run/config')
            }
        }
    }
}

// Compile the test mod during `check` so CI catches breakage without having to launch the game
tasks.named('check').configure {
    dependsOn tasks.named('testmodClasses')
}

base {
    archivesName = 'rebooter'
}

def shadow = propertyBool('enable_shadow')

tasks.named(shadow ? 'reobfShadowJar' : 'reobfJar').configure {
    archiveBaseName = '`rebooter'
}
